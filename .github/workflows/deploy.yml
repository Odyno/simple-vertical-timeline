name: Security Scan and Deploy
on:
  push:
    tags:
      - "*"
  pull_request:
    branches: [master, main]

permissions:
  contents: write
  security-events: write

jobs:
  security-scan:
    name: 10up WordPress Scanner
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.2']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ctype, curl, dom, fileinfo, filter, gd, hash, iconv, intl, json, mbstring, openssl, pcre, pdo, pdo_sqlite, phar, posix, simplexml, soap, sockets, sodium, sqlite3, tokenizer, xml, xmlreader, xmlwriter, zip, zlib
          coverage: none

      - name: 10up WP Scanner (syntax, vulnerabilities, virus)
        uses: 10up/wp-scanner-action@main
        with:
          disable_virus_scan: 'true'
          vuln_api_provider: 'wordfence'
          wp_core_version: '6.7'
        env:
          VULN_API_TOKEN: ${{ secrets.VULN_API_TOKEN || '' }}

      - name: PHP Compatibility Check
        run: |
          composer global require phpcompatibility/php-compatibility
          phpcs --config-set installed_paths $HOME/.composer/vendor/phpcompatibility/php-compatibility
          phpcs --standard=PHPCompatibility --extensions=php --runtime-set testVersion ${{ matrix.php-version }}- --ignore=*/vendor/*,*/node_modules/*,*/.git/* .

  deploy:
    name: Deploy to WordPress.org
    needs: security-scan
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 10up WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: simple-vertical-timeline
          README_NAME: readme.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-assets:
    name: Update wp.org Assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 10up WordPress Plugin Asset Update
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: simple-vertical-timeline
          README_NAME: readme.txt